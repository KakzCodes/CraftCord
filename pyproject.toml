[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "craftcord"
version = "1.0.0"
description = "A Discord bot for starting, stopping, restarting, and monitoring Minecraft servers hosted on a Pterodactyl panel."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

dependencies = [
    "discord.py>=2.4,<3.0",
    "SQLAlchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "httpx>=0.27,<1.0",
    "mcrcon>=0.7.0,<1.0",
    "structlog>=24.1,<25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10.0",
    "pytest-asyncio>=1.4,<2.0",
    "respx>=0.21,<1.0",
    "testcontainers[postgres]>=4.0,<5.0",
    "coverage[toml]>=7.4,<8.0",
    "ruff>=0.17,<0.18",
    "pip-audit>=2.10,<3.0",
]

[project.scripts]
craftcord = "craftcord.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/craftcord"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["src/craftcord"]
branch = true

[tool.coverage.report]
fail_under = 70
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# Without this, ruff's import sorter mistakes the third-party `alembic`
# package for a first-party/local import -- this project also has a
# top-level `alembic/` directory (migrations), and ruff's classifier
# gets confused by the name collision, grouping `from alembic import
# context` alongside our own `craftcord` imports instead of with other
# third-party packages like sqlalchemy.
known-third-party = ["alembic"]
