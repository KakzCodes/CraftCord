[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# The actual URL is injected at runtime by alembic/env.py from
# craftcord.config.get_settings() (i.e. from DATABASE_URL). This is left
# blank here deliberately so there's exactly one source of truth for the
# connection string.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
